server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Caddy supplies the original client values in production. Forward them
    # unchanged so Express can trust this single Nginx hop.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location ~ ^/(account|school|platform|join-school|bookmarks|progress)(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri.html =404;
  }
  location ~* \.(?:css|js|svg|png|webp|webmanifest)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html =404;
  }
}
