name: LearnBridge CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform operation for the production infrastructure
        required: true
        default: skip
        type: choice
        options:
          - skip
          - plan
          - apply
      allow_destructive:
        description: Allow a Terraform plan containing delete or replacement actions
        required: true
        default: false
        type: boolean
      deploy_application:
        description: Build and deploy the LearnBridge application
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: learnbridge-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_NAMESPACE: prayo25
  IMAGE_TAG: sha-${{ github.sha }}
  TF_WORKING_DIR: terraform
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-check:
    name: Validate Terraform configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9.0"
          terraform_wrapper: false

      - name: Require Terraform configuration
        run: test -f "$TF_WORKING_DIR/main.tf"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive "$TF_WORKING_DIR"

      - name: Initialize without remote state
        run: terraform -chdir="$TF_WORKING_DIR" init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir="$TF_WORKING_DIR" validate

  terraform-infrastructure:
    name: Plan or apply Azure infrastructure
    if: github.event_name == 'workflow_dispatch' && inputs.terraform_action != 'skip'
    needs: terraform-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    outputs:
      public_ip: ${{ steps.infrastructure-output.outputs.public_ip }}

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
      TF_VAR_ssh_source_address_prefix: ${{ secrets.SSH_SOURCE_ADDRESS_PREFIX }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      TERRAFORM_ACTION: ${{ inputs.terraform_action }}
      ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9.0"
          terraform_wrapper: false

      - name: Validate infrastructure inputs
        run: |
          set -Eeuo pipefail
          test -n "$ARM_CLIENT_ID"
          test -n "$ARM_TENANT_ID"
          test -n "$ARM_SUBSCRIPTION_ID"
          test -n "$TF_VAR_admin_ssh_public_key"
          test -n "$TFSTATE_RESOURCE_GROUP"
          test -n "$TFSTATE_STORAGE_ACCOUNT"
          test -n "$TFSTATE_CONTAINER"
          test -n "$TFSTATE_KEY"

      - name: Initialize remote Terraform state
        run: |
          terraform -chdir="$TF_WORKING_DIR" init \
            -input=false \
            -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Create reviewed Terraform plan
        run: |
          terraform -chdir="$TF_WORKING_DIR" plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan
          terraform -chdir="$TF_WORKING_DIR" show -json tfplan > "$RUNNER_TEMP/tfplan.json"

      - name: Show Terraform plan
        run: terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan

      - name: Block unapproved destructive changes
        run: |
          set -Eeuo pipefail
          destructive_count="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$RUNNER_TEMP/tfplan.json")"
          echo "Terraform delete/replacement actions: $destructive_count"
          if [ "$destructive_count" -gt 0 ] && [ "$ALLOW_DESTRUCTIVE" != "true" ]; then
            echo "::error::Terraform proposes $destructive_count destructive or replacement action(s). Reconcile/import the existing Azure resources, or explicitly approve destructive changes."
            exit 1
          fi

      - name: Apply reviewed Terraform plan
        if: inputs.terraform_action == 'apply'
        run: terraform -chdir="$TF_WORKING_DIR" apply -input=false -auto-approve tfplan

      - name: Capture Terraform public IP
        id: infrastructure-output
        shell: bash
        run: |
          public_ip="$(terraform -chdir="$TF_WORKING_DIR" output -raw public_ip_address 2>/dev/null || true)"
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"
          if [ -n "$public_ip" ]; then
            echo "Terraform public IP: $public_ip"
          fi

  build-test-push:
    name: Test, build and publish images
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_application == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production frontend and SEO pages
        run: npm run build

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-api:production
          cache-from: type=gha,scope=learnbridge-api
          cache-to: type=gha,mode=max,scope=learnbridge-api

      - name: Build and push web image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-web:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-web:production
          cache-from: type=gha,scope=learnbridge-web
          cache-to: type=gha,mode=max,scope=learnbridge-web

  deploy-production:
    name: Deploy to Azure VM
    needs:
      - terraform-check
      - terraform-infrastructure
      - build-test-push
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.terraform-check.result == 'success' &&
      needs.build-test-push.result == 'success' &&
      (needs.terraform-infrastructure.result == 'success' || needs.terraform-infrastructure.result == 'skipped') &&
      (github.event_name == 'push' || inputs.deploy_application == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://learnbridge-app.com
    permissions:
      contents: read
      id-token: write

    env:
      SSH_HOST: ${{ secrets.VM_HOST }}
      SSH_USER: ${{ secrets.VM_USER }}
      TERRAFORM_PUBLIC_IP: ${{ needs.terraform-infrastructure.outputs.public_ip }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_NSG_NAME: ${{ vars.AZURE_NSG_NAME }}

    steps:
      - name: Verify deployment host matches Terraform
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          if [ -n "$TERRAFORM_PUBLIC_IP" ] && [ "$TERRAFORM_PUBLIC_IP" != "$SSH_HOST" ]; then
            echo "::error::Terraform reports $TERRAFORM_PUBLIC_IP but VM_HOST is $SSH_HOST. Update VM_HOST and VM_KNOWN_HOSTS, then rerun with terraform_action=skip."
            exit 1
          fi

      - name: Azure login for temporary SSH access
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure production VM is running
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
        shell: bash
        run: |
          set -Eeuo pipefail

          resource_group="${AZURE_RESOURCE_GROUP:-LEARNBRIDGEAPP-RG}"
          vm_name="${AZURE_VM_NAME:-learnbridgeapp-vm}"

          power_state="$(az vm get-instance-view \
            --resource-group "$resource_group" \
            --name "$vm_name" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" \
            --output tsv)"

          if [[ "$power_state" != "PowerState/running" ]]; then
            echo "Starting $vm_name..."
            az vm start \
              --resource-group "$resource_group" \
              --name "$vm_name"
          fi

          az vm wait \
            --resource-group "$resource_group" \
            --name "$vm_name" \
            --created

      - name: Temporarily authorize this runner for SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          resource_group="${AZURE_RESOURCE_GROUP:-learnbridgeapp-rg}"
          nsg_name="${AZURE_NSG_NAME:-learnbridgeapp-nsg}"
          runner_ip="$(curl -4 --fail --silent --show-error https://api.ipify.org)"
          test -n "$runner_ip"
          echo "Authorizing GitHub runner ${runner_ip}/32 for this deployment."
          az network nsg rule create \
            --resource-group "$resource_group" \
            --nsg-name "$nsg_name" \
            --name github-actions-temporary-ssh \
            --priority 1090 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefixes "${runner_ip}/32" \
            --source-port-ranges '*' \
            --destination-address-prefixes '*' \
            --destination-port-ranges 22 \
            --only-show-errors \
            --output none

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy and verify exact release
        env:
          DEPLOY_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_TAG='$DEPLOY_TAG' DOCKERHUB_NAMESPACE='$DOCKERHUB_NAMESPACE' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "$HOME/learnbridge"
          test -s .env
          test -s compose.prod.yml

          compose() {
            docker compose --env-file .env -f compose.prod.yml "$@"
          }

          update_image_tag() {
            local tag="$1"
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${tag}|" .env
            else
              printf '\nIMAGE_TAG=%s\n' "$tag" >> .env
            fi
            chmod 600 .env
            test "$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n 1)" = "$tag"
          }

          previous_tag="$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n 1)"
          previous_tag="${previous_tag:-v8.0.8}"

          mkdir -p backups
          timestamp="$(date +%Y%m%d-%H%M%S)"
          env_backup="backups/.env-before-${DEPLOY_TAG}-${timestamp}"
          database_backup="backups/learnbridge-before-${DEPLOY_TAG}-${timestamp}.dump"

          install -m 600 .env "$env_backup"
          compose exec -T db sh -c \
            'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$database_backup"
          test -s "$database_backup"

          find backups -type f -name 'learnbridge-before-*.dump' -mtime +14 -delete
          find backups -type f -name '.env-before-*' -mtime +14 -delete

          IMAGE_TAG="$DEPLOY_TAG" compose pull api web

          rollback() {
            failure_status=$?
            trap - ERR
            set +e
            echo "Deployment failed; restoring ${previous_tag}."
            install -m 600 "$env_backup" .env
            compose pull api web
            compose up -d --force-recreate api web
            compose restart caddy
            exit "$failure_status"
          }

          trap rollback ERR

          update_image_tag "$DEPLOY_TAG"
          compose config --quiet
          compose up -d --force-recreate api web

          api_healthy=false
          for attempt in $(seq 1 30); do
            if compose exec -T api node -e \
              "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              api_healthy=true
              break
            fi
            sleep 10
          done
          test "$api_healthy" = true

          web_healthy=false
          for attempt in $(seq 1 18); do
            web_id="$(compose ps -q web)"
            if test -n "$web_id" && \
              test "$(docker inspect --format '{{.State.Health.Status}}' "$web_id")" = healthy; then
              web_healthy=true
              break
            fi
            sleep 10
          done
          test "$web_healthy" = true

          api_id="$(compose ps -q api)"
          web_id="$(compose ps -q web)"
          api_image="$(docker inspect --format '{{.Config.Image}}' "$api_id")"
          web_image="$(docker inspect --format '{{.Config.Image}}' "$web_id")"

          test "$api_image" = "${DOCKERHUB_NAMESPACE}/learnbridge-api:${DEPLOY_TAG}"
          test "$web_image" = "${DOCKERHUB_NAMESPACE}/learnbridge-web:${DEPLOY_TAG}"

          expected_version="$(compose exec -T api node -p "require('./package.json').version")"
          test -n "$expected_version"

          compose restart caddy

          public_healthy=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://learnbridge-app.com/api/health?nocache=$(date +%s)" |
              EXPECTED_VERSION="$expected_version" python3 -c \
                'import json,os,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("status")=="ok" and data.get("version")==os.environ["EXPECTED_VERSION"] else 1)'; then
              public_healthy=true
              break
            fi
            sleep 10
          done
          test "$public_healthy" = true

          trap - ERR
          compose ps
          echo "LearnBridge ${DEPLOY_TAG} (version ${expected_version}) deployed and verified successfully."
          REMOTE

      - name: Remove temporary SSH access
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          resource_group="${AZURE_RESOURCE_GROUP:-learnbridgeapp-rg}"
          nsg_name="${AZURE_NSG_NAME:-learnbridgeapp-nsg}"
          az network nsg rule delete \
            --resource-group "$resource_group" \
            --nsg-name "$nsg_name" \
            --name github-actions-temporary-ssh \
            --only-show-errors \
            --output none || true
