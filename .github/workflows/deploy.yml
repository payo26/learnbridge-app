name: LearnBridge CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnbridge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_NAMESPACE: prayo25
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-test-push:
    name: Test, build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production frontend and SEO pages
        run: npm run build

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-api:production
          cache-from: type=gha,scope=learnbridge-api
          cache-to: type=gha,mode=max,scope=learnbridge-api

      - name: Build and push web image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-web:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/learnbridge-web:production
          cache-from: type=gha,scope=learnbridge-web
          cache-to: type=gha,mode=max,scope=learnbridge-web

  deploy-production:
    name: Deploy to Azure VM
    if: github.event_name != 'pull_request'
    needs: build-test-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://learnbridge-app.com

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy and verify exact release
        env:
          SSH_HOST: ${{ secrets.VM_HOST }}
          SSH_USER: ${{ secrets.VM_USER }}
          DEPLOY_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_TAG='$DEPLOY_TAG' DOCKERHUB_NAMESPACE='$DOCKERHUB_NAMESPACE' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "$HOME/learnbridge"
          test -s .env
          test -s compose.prod.yml

          compose() {
            docker compose --env-file .env -f compose.prod.yml "$@"
          }

          update_image_tag() {
            local tag="$1"
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${tag}|" .env
            else
              printf '\nIMAGE_TAG=%s\n' "$tag" >> .env
            fi
            chmod 600 .env
            test "$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n 1)" = "$tag"
          }

          previous_tag="$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n 1)"
          previous_tag="${previous_tag:-v8.0.8}"

          mkdir -p backups
          timestamp="$(date +%Y%m%d-%H%M%S)"
          env_backup="backups/.env-before-${DEPLOY_TAG}-${timestamp}"
          database_backup="backups/learnbridge-before-${DEPLOY_TAG}-${timestamp}.dump"

          install -m 600 .env "$env_backup"
          compose exec -T db sh -c \
            'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$database_backup"
          test -s "$database_backup"

          find backups -type f -name 'learnbridge-before-*.dump' -mtime +14 -delete
          find backups -type f -name '.env-before-*' -mtime +14 -delete

          IMAGE_TAG="$DEPLOY_TAG" compose pull api web

          rollback() {
            failure_status=$?
            trap - ERR
            set +e
            echo "Deployment failed; restoring ${previous_tag}."
            install -m 600 "$env_backup" .env
            compose pull api web
            compose up -d --force-recreate api web
            compose restart caddy
            exit "$failure_status"
          }

          trap rollback ERR

          update_image_tag "$DEPLOY_TAG"
          compose config --quiet
          compose up -d --force-recreate api web

          api_healthy=false
          for attempt in $(seq 1 30); do
            if compose exec -T api node -e \
              "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              api_healthy=true
              break
            fi
            sleep 10
          done
          test "$api_healthy" = true

          web_healthy=false
          for attempt in $(seq 1 18); do
            web_id="$(compose ps -q web)"
            if test -n "$web_id" && \
              test "$(docker inspect --format '{{.State.Health.Status}}' "$web_id")" = healthy; then
              web_healthy=true
              break
            fi
            sleep 10
          done
          test "$web_healthy" = true

          api_id="$(compose ps -q api)"
          web_id="$(compose ps -q web)"
          api_image="$(docker inspect --format '{{.Config.Image}}' "$api_id")"
          web_image="$(docker inspect --format '{{.Config.Image}}' "$web_id")"

          test "$api_image" = "${DOCKERHUB_NAMESPACE}/learnbridge-api:${DEPLOY_TAG}"
          test "$web_image" = "${DOCKERHUB_NAMESPACE}/learnbridge-web:${DEPLOY_TAG}"

          expected_version="$(compose exec -T api node -p "require('./package.json').version")"
          test -n "$expected_version"

          compose restart caddy

          public_healthy=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://learnbridge-app.com/api/health?nocache=$(date +%s)" |
              EXPECTED_VERSION="$expected_version" python3 -c \
                'import json,os,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("status")=="ok" and data.get("version")==os.environ["EXPECTED_VERSION"] else 1)'; then
              public_healthy=true
              break
            fi
            sleep 10
          done
          test "$public_healthy" = true

          trap - ERR
          compose ps
          echo "LearnBridge ${DEPLOY_TAG} (version ${expected_version}) deployed and verified successfully."
          REMOTE
